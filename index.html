<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="contactform.css">
</head>
<body>
  <div class="form-container">
    <h1>Contact Form</h1>
    <p>Please fill all the texts in the fields.</p>

    <form>
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required placeholder="Your Full Name">

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required placeholder="Valid Email Address">

      <label for="subject">Subject</label>
      <select id="subject" name="subject" required>
        <option value="job">Job Inquiry</option>
        <option value="support">Support</option>
        <option value="feedback">Feedback</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required placeholder="Your Message to Us"></textarea>

      <button type="submit">Send</button>
    </form>
  </div>
</body>
</html>
